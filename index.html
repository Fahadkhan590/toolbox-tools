Rg={privacy:{title:"Privacy Policy",body:`Last updated: June 2025

This Privacy Policy explains how Toolbox ("we", "our", or "us") collects, uses, and protects your personal data when you visit our website.

1. Information We Collect
We may collect the following types of information: (a) device and browser data such as IP address, user agent, screen resolution, and operating system; (b) usage data such as pages visited, time spent, and referral source via cookies and analytics tools.

2. How We Use Your Information
Your data is used to operate and improve the Toolbox, provide analytics, show relevant advertisements, and detect security or fraudulent activity.

3. Advertising – Monetag
Toolbox participates in the Monetag ad network. Monetag may collect and process certain device and browsing data to serve personalised advertisements. This may include your IP address, device identifiers, browser type, approximate location, and pages you visit. For more details, please review Monetag's own privacy policy at https://www.monetag.com/privacy-policy. You may opt out of interest-based advertising via your device settings or by visiting https://optout.aboutads.info.

4. Cookies
We and our third-party partners (including Monetag) use cookies and similar tracking technologies to remember your preferences, analyse site traffic, and serve relevant ads. You can control cookie preferences in your browser settings. Blocking some cookies may affect site functionality.

5. Third-Party Services
We may use third-party analytics and advertising services (e.g., Monetag, Google Analytics) which process data under their own privacy policies. We are not responsible for the data practices of these third parties.

6. Data Retention
We retain your data only as long as necessary for the purposes described in this policy, or as required by law.

7. Your Rights
Depending on your jurisdiction, you may have the right to access, correct, delete, or port your personal data, and to withdraw consent or object to processing. To exercise these rights, contact us using the details below.

8. Changes to This Policy
We may update this Privacy Policy from time to time. Changes will be posted on this page with a new "Last updated" date.

9. Contact
If you have questions about this policy, please reach out to us at the contact details provided on the About page.`},terms:{title:"Terms of Service",body:`Last updated: June 2025

By accessing or using Toolbox, you agree to be bound by these Terms of Service. If you do not agree, do not use the site.

1. Use of the Site
Toolbox provides a directory of free AI tools for informational purposes only. You may browse, search, save, and submit tool entries. You agree not to misuse the site, including but not limited to submitting false information, scraping data beyond reasonable personal use, or attempting to disrupt the service.

2. Tool Submissions
When you submit a tool, you represent that the information is accurate to the best of your knowledge. Toolbox reserves the right to remove or reject any submission at its sole discretion. Submitted tools are displayed locally in your browser and are not reviewed or endorsed by Toolbox.

3. Third-Party Links
Toolbox contains links to third-party websites and tools. We do not control, endorse, or assume responsibility for the content, privacy practices, or availability of any third-party site.

4. Advertisements
Toolbox displays advertisements via the Monetag ad network. We are not responsible for the content or practices of any advertisement or third-party ad partner.

5. No Warranty
The Toolbox directory is provided "as is" without any warranty, express or implied. We do not guarantee that the listed tools are free, functional, or suitable for any particular purpose.

6. Limitation of Liability
Toolbox and its creator shall not be liable for any damages arising from your use of or reliance on the directory, linked tools, or advertisements.

7. Changes to These Terms
We may update these Terms at any time. Continued use after changes constitutes acceptance of the new Terms.

8. Governing Law
These Terms shall be governed by the applicable laws of Pakistan.`},faq:{title:"Frequently Asked Questions",body:`Q: What is Toolbox?
A: Toolbox is a free directory website that collects, categorises, and describes free AI tools. You can search, filter, save, submit, and visit tools from a single interface.

Q: Is Toolbox free to use?
A: Yes. Toolbox is completely free. The site may display ads to cover operational costs.

Q: How do I save a tool?
A: Click the bookmark icon on any tool card. Your saves are stored in your browser's local storage and will persist across visits on the same device.

Q: How do I submit a new tool?
A: Click the "Submit tool" button in the header or hero section. Fill in the name, website URL, category, pricing, and optional tags. If the tool already exists in the directory, you will see a message telling you it is already listed.

Q: My submitted tool is not showing. Why?
A: Submitted tools are stored only in your browser. They are not uploaded to any server. If you clear your browser data, they will be lost.

Q: I found a broken link. What should I do?
A: You can report it via the contact details on the About page, or simply skip to the next tool.

Q: Who created Toolbox?
A: Toolbox was created by The Toolbox Creator. See the About page for more details.

Q: Do I need an account to use Toolbox?
A: No. Toolbox does not require any account, sign-up, or login.

Q: Why do I see ads on Toolbox?
A: Toolbox uses the Monetag ad network to display advertisements. This helps keep the site free and operational.`},about:{title:"About Toolbox",body:`Welcome to Toolbox.

Toolbox is a curated directory of free AI tools, designed to help you find, compare, and access practical AI resources across writing, design, video, coding, research, audio, productivity, and business.

This site was created by The Toolbox Creator.

The Toolbox Creator built Toolbox to provide a simple, organised, and ad-supported space where anyone can discover powerful AI tools without digging through scattered lists or paywalled directories.

Every tool listed here includes a review, usage guidance, a pro tip, and a direct link to the tool's website. You can search, filter by category, sort by rating, save your favourites, and even submit new tools to your personal local directory.
